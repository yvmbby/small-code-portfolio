const groups=[{"tab": "SQL", "items": [{"name": "Uninvoiced orders", "subtitle": "Orders without matching invoice records", "language": "sql", "code": "SELECT o.ORDERNO, o.ORDER_DATE, c.Name AS CUSTOMER_NAME,\no.EXP_SHIP_DATE, e.NAME AS SALESPERSON_NAME\nFROM ORDERS o\nINNER JOIN CUSTOMERS c ON o.CUSTOMERNO = c.CUSTOMERNO\nINNER JOIN EMPLOYEES e ON o.EID = e.EID\nLEFT JOIN INVOICES i ON o.ORDERNO = i.ORDERNO\nWHERE i.ORDERNO IS NULL;"}, {"name": "Sales by category", "subtitle": "Category-level financial analysis", "language": "sql", "code": "SELECT c.DESCRIPTION AS CATEGORY,\nFORMAT(MIN(p.STANDARD_SELLING_PRICE), 'C') AS MIN_PRICE,\nFORMAT(MAX(p.STANDARD_SELLING_PRICE), 'C') AS MAX_PRICE,\nFORMAT(AVG(p.STANDARD_SELLING_PRICE), 'C') AS AVG_PRICE\nFROM PRODUCTS p\nINNER JOIN CATEGORIES c ON p.CATEGORYID = c.CATEGORYID\nGROUP BY c.DESCRIPTION;"}, {"name": "Discount analysis", "subtitle": "Total discounts by order line", "language": "sql", "code": "SELECT FORMAT(SUM(po.PRICE * po.QTY * po.DISC_PERCENT), 'C') AS TOTAL_DISCOUNTS\nFROM PRODUCTS_ORDERED po\nWHERE po.DISC_PERCENT > 0;"}]}, {"tab": "Python", "items": [{"name": "Data preparation", "subtitle": "Sampling, encoding, and standardization", "language": "python", "code": "sample_df = df.sample(frac=0.95, random_state=18822974)\n\nprint(\"95% random sample created successfully.\")\n\nfrom sklearn.preprocessing import StandardScaler\n\n# Separate categorical and numerical variables\ncategorical_cols = df.select_dtypes(\n    include=['object', 'category']\n).columns\n\nnumeric_cols = df.select_dtypes(\n    include=['number']\n).columns\n\n# Reference category one-hot encoding\nencoded_df = pd.get_dummies(\n    df,\n    columns=categorical_cols,\n    drop_first=True,\n    dtype=int\n)\n\n# Standardize numerical variables only\nscaler = StandardScaler()\n\nstandardized_df = encoded_df.copy()\n\nstandardized_df[numeric_cols] = scaler.fit_transform(\n    encoded_df[numeric_cols]\n)\n\nprint(\"Standardized dataset shape:\", standardized_df.shape)\n\ndisplay(standardized_df.head())"}, {"name": "K-Means clustering", "subtitle": "Cluster analysis and silhouette scoring", "language": "python", "code": "from sklearn.cluster import KMeans\nfrom sklearn.metrics import silhouette_score\n\n# Exclude the target variable from clustering\nX_cluster = standardized_df.drop(columns=['LeftCompany'])\n\nsilhouette_scores = {}\ncluster_results = {}\n\nfor k in [3, 4, 5]:\n    kmeans = KMeans(\n        n_clusters=k,\n        random_state=18822974,\n        n_init=10\n    )\n\n    labels = kmeans.fit_predict(X_cluster)\n\n    silhouette_scores[k] = silhouette_score(\n        X_cluster, labels\n    )\n\n    cluster_results[k] = labels\n\n    # Save cluster assignments\n    df[f'Cluster_k{k}'] = labels\n\n    print(f\"\\nk = {k}\")\n    print(f\"Silhouette Score: {silhouette_scores[k]:.4f}\")\n\n    cluster_summary = pd.DataFrame({\n        'Count': pd.Series(labels).value_counts(),\n        'Proportion': pd.Series(labels).value_counts(\n            normalize=True\n        )\n    }).sort_index()\n\n    display(cluster_summary.round(4))"}, {"name": "Decision tree classification", "subtitle": "Five-fold cross-validation and classification metrics", "language": "python", "code": "from sklearn.tree import DecisionTreeClassifier\nfrom sklearn.model_selection import StratifiedKFold\n\n# Define Decision Tree hyperparameters\ndt_params = {\n    'min_samples_leaf': 100,\n    'max_depth': 4,\n    'random_state': 18822974\n}\n\n# Define 5-fold stratified cross-validation\ncv = StratifiedKFold(\n    n_splits=5,\n    shuffle=True,\n    random_state=18822974\n)\n\n# Initialize Decision Tree\ndt_model = DecisionTreeClassifier(**dt_params)\n\nprint(\"Decision Tree Hyperparameters:\")\nprint(dt_model.get_params())\n\nprint(\"\\nCross-validation:\")\nprint(\"Number of folds:\", cv.n_splits)\n\nfrom sklearn.model_selection import cross_val_predict\nfrom sklearn.metrics import (\n    roc_auc_score,\n    accuracy_score,\n    recall_score,\n    precision_score,\n    f1_score,\n    confusion_matrix\n)\nfrom sklearn.tree import DecisionTreeClassifier\nimport numpy as np\nimport pandas as pd\n\n# Full Decision Tree Model\ndt_full = DecisionTreeClassifier(**dt_params)\n\n# 5-fold cross-validated predictions\ny_pred_full = cross_val_predict(\n    dt_full, X_full, y,\n    cv=cv, method='predict'\n)\n\n# Cross-validated probabilities\ny_prob_full = cross_val_predict(\n    dt_full, X_full, y,\n    cv=cv, method='predict_proba'\n)[:, 1]\n\n# Probability measures\np1 = np.mean(y_prob_full)\np0 = 1 - p1\n\n# Gini and Entropy\ngini_full = 1 - (p0**2 + p1**2)\n\nentropy_full = -sum(\n    p * np.log2(p) for p in [p0, p1] if p > 0\n)\n\n# Confusion matrix\ntn, fp, fn, tp = confusion_matrix(\n    y, y_pred_full, labels=[0, 1]\n).ravel()\n\n# Store metrics\ndt_full_results = {\n    'Model': 'Full',\n    'Algorithm': 'DT',\n    'Prob. Measure': p1,\n    'Gini Index': gini_full,\n    'Entropy': entropy_full,\n    'AUC': roc_auc_score(y, y_prob_full),\n    'Accuracy': accuracy_score(y, y_pred_full),\n    'Recall': recall_score(y, y_pred_full),\n    'Specificity': tn / (tn + fp),\n    'Precision': precision_score(\n        y, y_pred_full, zero_division=0\n    ),\n    'F1-Score': f1_score(\n        y, y_pred_full, zero_division=0\n    )\n}\n\ndisplay(\n    pd.DataFrame([dt_full_results]).round(4)\n)"}, {"name": "Neural network classification", "subtitle": "MLP classifier and cross-validated evaluation", "language": "python", "code": "from sklearn.neural_network import MLPClassifier\n\n# Define Neural Network hyperparameters\nnn_params = {\n    'hidden_layer_sizes': (3, 5),\n    'activation': 'relu',\n    'solver': 'adam',\n    'max_iter': 2000,\n    'random_state': 18822974\n}\n\n# Initialize Neural Network\nnn_model = MLPClassifier(**nn_params)\n\nprint(\"Neural Network Hyperparameters:\")\nprint(\"Hidden Layers:\", nn_model.hidden_layer_sizes)\nprint(\"Number of Hidden Layers:\", len(nn_model.hidden_layer_sizes))\nprint(\"Activation:\", nn_model.activation)\nprint(\"Solver:\", nn_model.solver)\nprint(\"Maximum Iterations:\", nn_model.max_iter)\nprint(\"Random State:\", nn_model.random_state)\n\n# Full Neural Network Model\nnn_full = MLPClassifier(**nn_params)\n\n# 5-fold cross-validated predictions\ny_pred_nn_full = cross_val_predict(\n    nn_full, X_full, y,\n    cv=cv, method='predict'\n)\n\n# Cross-validated probabilities\ny_prob_nn_full = cross_val_predict(\n    nn_full, X_full, y,\n    cv=cv, method='predict_proba'\n)[:, 1]\n\n# Confusion matrix\ntn, fp, fn, tp = confusion_matrix(\n    y, y_pred_nn_full, labels=[0, 1]\n).ravel()\n\n# Store metrics\nnn_full_results = {\n    'Model': 'Full',\n    'Algorithm': 'NN',\n    'Prob. Measure': 'N/A',\n    'Gini Index': 'N/A',\n    'Entropy': 'N/A',\n    'AUC': roc_auc_score(y, y_prob_nn_full),\n    'Accuracy': accuracy_score(y, y_pred_nn_full),\n    'Recall': recall_score(y, y_pred_nn_full),\n    'Specificity': tn / (tn + fp),\n    'Precision': precision_score(\n        y, y_pred_nn_full, zero_division=0\n    ),\n    'F1-Score': f1_score(\n        y, y_pred_nn_full, zero_division=0\n    )\n}\n\ndisplay(pd.DataFrame([nn_full_results]).round(4))"}]}, {"tab": "KNIME", "items": [{"name": "Fraud detection workflow", "subtitle": "Fraud classification model comparison", "language": "text", "code": "CSV Reader → Partitioning → Missing Value → Normalizer\n  ├─ Logistic Regression → Predictor → Scorer\n  ├─ Decision Tree       → Predictor → Scorer\n  ├─ Random Forest       → Predictor → Scorer\n  └─ Naïve Bayes         → Predictor → Scorer\n\nAdditional analysis: K-Means clustering for anomalies"}, {"name": "Account classification", "subtitle": "Account classification model comparison", "language": "text", "code": "Excel Reader → Table Partitioner → RowID → Column Filter\n→ Domain Calculator → One to Many (encoding)\n→ Stratified Partitioning\n  ├─ Decision Tree → Predictor → Scorer\n  ├─ Random Forest → Predictor → Scorer\n  └─ Naïve Bayes   → Predictor → Scorer"}]}];
const tabs=document.getElementById('tabs'), samples=document.getElementById('samples');

function render(n){
 tabs.replaceChildren();samples.replaceChildren();

 groups[n].items.forEach(item=>{
